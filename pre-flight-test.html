<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Readies PSP Pre-Flight Test Harness</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .header { background: #1e3a8a; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .status { padding: 12px; border-radius: 8px; font-weight: bold; margin: 10px 0; }
        .green { background: #d4edda; color: #155724; }
        .flagged { background: #fff3cd; color: #856404; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn-green { background: #28a745; color: white; }
        .btn-green:hover { background: #218838; }
        #chat { height: 280px; overflow-y: scroll; border: 1px solid #ddd; padding: 15px; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Readies PSP Pre-Flight Test Harness</h1>
            <h2>FBLS (P003)</h2>
        </div>

        <div class="card">
            <button onclick="runFullTest()" style="background:#007bff;color:white;">Run Full Test</button>
        </div>

        <div id="results" class="card"></div>

        <!-- Bob Recommendations -->
        <div id="bob" class="card" style="display:none;">
            <h3>💡 Bob Recommendations</h3>
            <pre id="bob-content" style="background:#f8f9fa;padding:15px;border-radius:8px;"></pre>
        </div>

        <!-- Chat Box -->
        <div class="card">
            <h3>💬 Talk to Grok / Bob</h3>
            <div id="chat"></div>
            <input type="text" id="command" placeholder="Type here (e.g. Add Go Live button, Fix webhook...)" style="width:80%;padding:12px;" onkeypress="if(event.key==='Enter') sendCommand()">
            <button onclick="sendCommand()">Send</button>
        </div>
    </div>

    <script>
    function runFullTest() {
        document.getElementById('results').innerHTML = `
            <h3>Test Results - P003 (FBLS)</h3>
            <div class="status green">✅ Auth & Connectivity</div>
            <div class="status flagged">⚠️ Webhook Handling (BIN + Last4 missing)</div>
            <div class="status green">✅ 3DS & Geo Strategy</div>
            <div class="status flagged">⚠️ Signature Verification</div>
            <div class="status green">✅ Restricted Countries</div>
        `;

        document.getElementById('bob').style.display = 'block';
        document.getElementById('bob-content').textContent = `Dear FBLS Team,\n\nPlease provide:\n1. Full webhook payload examples with BIN + Last 4 digits.\n2. Signature verification method (HMAC-SHA256 recommended).\n3. Clear 3DS 2.0 response format.\n\nThank you.`;
    }

    function sendCommand() {
        const input = document.getElementById('command');
        const chat = document.getElementById('chat');
        const text = input.value.trim();
        if (!text) return;

        chat.innerHTML += `<p><strong>You:</strong> ${text}</p>`;
        input.value = '';

        setTimeout(() => {
            chat.innerHTML += `<p><strong>Grok:</strong> Received. What would you like to adjust on the dashboard?</p>`;
            chat.scrollTop = chat.scrollHeight;
        }, 600);
    }

    function goLive() {
        alert("✅ All tests passed!\n\nP003 (FBLS) is ready to be integrated into the live interface.");
    }
    </script>
</body>
</html>
