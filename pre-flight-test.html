<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Readies PSP Pre-Flight Test Harness</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .header { background: #1e3a8a; color: white; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .status { padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; }
        .green { background: #d4edda; color: #155724; }
        .flagged { background: #fff3cd; color: #856404; }
        button { padding: 14px 28px; font-size: 17px; border: none; border-radius: 8px; cursor: pointer; margin: 8px; }
        .chat { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 15px; background: #f8f9fa; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Readies PSP Pre-Flight Test Harness</h1>
            <h2>P003 - FBLS</h2>
        </div>

        <div class="card">
            <button onclick="runFullTest()">Run Full Test</button>
        </div>

        <div id="results" class="card"></div>

        <div class="card">
            <h3>💬 Talk to Grok / Bob</h3>
            <div id="chat" class="chat"></div>
            <input type="text" id="input" placeholder="Type your command here..." style="width:80%; padding:12px;" onkeypress="if(event.key==='Enter') sendCommand()">
            <button onclick="sendCommand()">Send</button>
        </div>
    </div>

    <script>
    function runFullTest() {
        document.getElementById('results').innerHTML = `
            <h3>Test Results - P003 (FBLS)</h3>
            <div class="status green">✅ Auth & Connectivity</div>
            <div class="status flagged">⚠️ Webhook Handling</div>
            <div class="status green">✅ 3DS & Geo Strategy</div>
            <div class="status flagged">⚠️ Signature Verification</div>
            <button onclick="goLive()" style="background:#28a745;color:white;">🚀 Go Live with P003</button>
        `;
    }

    function goLive() {
        alert("✅ All tests green! Ready to integrate P003 into live interface.");
    }

    function sendCommand() {
        const input = document.getElementById('input');
        const chat = document.getElementById('chat');
        if (!input.value.trim()) return;

        chat.innerHTML += `<p><strong>You:</strong> ${input.value}</p>`;
        input.value = '';

        setTimeout(() => {
            chat.innerHTML += `<p><strong>Grok:</strong> Command received. What would you like to change?</p>`;
            chat.scrollTop = chat.scrollHeight;
        }, 600);
    }
    </script>
</body>
</html>
