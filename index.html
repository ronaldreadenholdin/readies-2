<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readies PSP Test Board</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
        }
        .board {
            width: min(760px, calc(100% - 32px));
            padding: 32px;
            border-radius: 18px;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 24px 80px rgba(0,0,0,0.35);
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 40px; }
        p { color: #dbeafe; line-height: 1.6; }
        a {
            display: block;
            margin: 14px auto;
            padding: 16px 20px;
            max-width: 420px;
            border-radius: 12px;
            color: #111827;
            background: #67e8f9;
            text-decoration: none;
            font-weight: 800;
        }
        a.secondary { background: #bbf7d0; }
    </style>
</head>
<body>
    <main class="board">
        <h1>Readies PSP Test Board</h1>
        <p>Use the buttons below to open the live test pages.</p>
        <a href="/flamingo-test.html">Open Flamingo Test Board</a>
        <a class="secondary" href="/next-psp-start-here.html">Open Next PSP Starter</a>
        <a class="secondary" href="/pre-flight-test.html">Open Main PSP Dashboard</a>
    </main>
</body>
</html>
